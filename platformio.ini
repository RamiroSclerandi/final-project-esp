[env:esp32dev]
# Pinned exactly (Arduino-ESP32 2.0.17) so a platform release can never
# change the build underneath a clean checkout.
platform          = espressif32 @ 6.13.0
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
monitor_filters   = esp32_exception_decoder, default

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor  @ ^1.1.14
    bblanchon/ArduinoJson             @ 7.4.3
    knolleary/PubSubClient            @ ^2.8.0
    adafruit/DHT sensor library       @ ^1.4.6

# The native shims under lib/native_support/ (Arduino.h, fake DeviceInfo)
# exist only to host-compile pure logic in env:native. On a real device build
# they would shadow the framework's actual Arduino.h, so keep them out.
lib_ignore =
    native_support

# Static analysis gate:
# `pio check -e esp32dev --fail-on-defect=medium --fail-on-defect=high`.
# The suppression list is the accepted baseline; anything new at medium or
# above fails CI. Framework packages are skipped; third-party libdeps are
# suppressed in the baseline because their findings are not ours to fix.
check_tool          = cppcheck
check_skip_packages = yes
check_flags         =
    cppcheck: --inline-suppr --suppressions-list=check/cppcheck-baseline.txt

# On-target Unity suite (test/test_target/): same board/framework as
# env:esp32dev, but builds only the production code those tests exercise
# instead of the whole firmware — src/main.cpp's setup()/loop() would
# otherwise collide with the test's own. Mirrors the env:native split below.
# No hardware here: `pio test -e esp32dev-test --without-uploading` builds
# only; run for real with a device attached.
[env:esp32dev-test]
platform        = ${env:esp32dev.platform}
board           = ${env:esp32dev.board}
framework       = ${env:esp32dev.framework}
lib_ignore      = ${env:esp32dev.lib_ignore}
test_build_src  = yes
test_filter     = test_target
build_src_filter =
    -<*>
    +<storage/LittleFsBuffer.cpp>

# Host-side unit tests (Unity) for logic that does not need real hardware:
# codec, accumulator, backoff, local buffer. Compiles only the production sources those
# tests actually exercise, linked against the lib/native_support/ shims
# instead of the ESP32 framework.
[env:native]
platform         = native
test_build_src   = yes

# LDF's framework-compatibility guess sees a file named Arduino.h and assumes
# lib/native_support targets the "arduino" framework; since env:native sets
# none, it silently drops the library and Arduino.h stops resolving. Disable
# that guess — this is a private host-only shim, not a published library.
lib_compat_mode  = off

extra_scripts    = pre:scripts/native_project_dir.py

# test/test_target/ is on-target only (real FreeRTOS/WDT APIs the host shims
# do not provide); env:esp32dev-test builds it instead.
test_ignore = test_target

build_src_filter =
    -<*>
    +<core/Measurement.cpp>
    +<core/MeasurementAccumulator.cpp>
    +<sensors/SensorRegistry.cpp>
    +<codec/JsonCodec.cpp>
    +<transport/ConnectionBackoff.cpp>
    +<storage/LittleFsBuffer.cpp>

lib_deps =
    bblanchon/ArduinoJson @ 7.4.3

# lib/native_support/DeviceInfo.cpp implements include/core/DeviceInfo.h;
# PlatformIO does not expose the project's private include/ dir to library
# sources by default (only to src/ and test/), so it has to be added here.
build_flags =
    -Iinclude

# CI-only: MinGW on Windows does not ship ASan/UBSan, so this env is not
# runnable on the local dev host — it exists for the Linux CI runner.
[env:native-asan]
platform         = native
test_build_src   = yes
lib_compat_mode  = off
extra_scripts    = ${env:native.extra_scripts}

build_src_filter = ${env:native.build_src_filter}
lib_deps         = ${env:native.lib_deps}
test_ignore      = ${env:native.test_ignore}

build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g

build_unflags =
    -Os
