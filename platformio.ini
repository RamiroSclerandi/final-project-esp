[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600
monitor_filters   = esp32_exception_decoder, default

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor  @ ^1.1.14
    bblanchon/ArduinoJson             @ ^7.0.0
    knolleary/PubSubClient            @ ^2.8.0
    adafruit/DHT sensor library       @ ^1.4.6

# The native shims under lib/native_support/ (Arduino.h, fake DeviceInfo)
# exist only to host-compile pure logic in env:native. On a real device build
# they would shadow the framework's actual Arduino.h, so keep them out.
lib_ignore =
    native_support

# Host-side unit tests (Unity) for logic that does not need real hardware:
# codec, accumulator, backoff. Compiles only the production sources those
# tests actually exercise, linked against the lib/native_support/ shims
# instead of the ESP32 framework.
[env:native]
platform         = native
test_build_src   = yes

# LDF's framework-compatibility guess sees a file named Arduino.h and assumes
# lib/native_support targets the "arduino" framework; since env:native sets
# none, it silently drops the library and Arduino.h stops resolving. Disable
# that guess — this is a private host-only shim, not a published library.
lib_compat_mode  = off

build_src_filter =
    -<*>
    +<core/Measurement.cpp>
    +<core/MeasurementAccumulator.cpp>
    +<sensors/SensorRegistry.cpp>
    +<codec/JsonCodec.cpp>
    +<transport/ConnectionBackoff.cpp>

lib_deps =
    bblanchon/ArduinoJson @ 7.4.3

# lib/native_support/DeviceInfo.cpp implements include/core/DeviceInfo.h;
# PlatformIO does not expose the project's private include/ dir to library
# sources by default (only to src/ and test/), so it has to be added here.
build_flags =
    -Iinclude

# CI-only: MinGW on Windows does not ship ASan/UBSan, so this env is not
# runnable on the local dev host — it exists for the Linux CI runner.
[env:native-asan]
platform         = native
test_build_src   = yes
lib_compat_mode  = off

build_src_filter = ${env:native.build_src_filter}
lib_deps         = ${env:native.lib_deps}

build_flags =
    ${env:native.build_flags}
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g

build_unflags =
    -Os
