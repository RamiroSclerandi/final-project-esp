name: firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      # config.h is gitignored (real credentials); the example compiles the
      # same code paths with placeholder values.
      - name: Provide config.h from the example
        run: cp include/config.example.h include/config.h
      - name: Host unit tests
        run: pio test -e native
      - name: Host unit tests under ASan/UBSan
        run: pio test -e native-asan
      # --fail-on-defect matches exact severities, so both levels are listed.
      - name: Static analysis against the baseline
        run: pio check -e esp32dev --fail-on-defect=medium --fail-on-defect=high

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Provide config.h from the example
        run: cp include/config.example.h include/config.h
      - name: Build firmware
        run: pio run -e esp32dev

  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      # Check-only, and only on lines this PR changes: legacy code is never
      # reformatted just because a neighbouring line was touched.
      - name: Check formatting of changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          output=$(git clang-format --diff --extensions c,cpp,h,hpp "origin/${BASE_REF}" || true)
          echo "$output"
          case "$output" in
            "" | *"no modified files to format"* | *"clang-format did not modify any files"*) exit 0 ;;
            *) exit 1 ;;
          esac
